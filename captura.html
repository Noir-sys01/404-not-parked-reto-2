<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportar una obstrucción</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; color: #1f2a37; max-width: 520px; margin: 0 auto; padding: 12px; }
    h1 { font-size: 1.2rem; margin: 4px 0 8px; }
    #mapa-captura { height: 240px; border-radius: 6px; margin: 6px 0; }
    label { display: block; font-size: .9rem; margin: 10px 0 2px; font-weight: 600; }
    select, input[type=file], button { width: 100%; padding: 10px; font-size: 1rem; }
    button { margin-top: 12px; cursor: pointer; }
    #btn-enviar { background: #1f2a37; color: #fff; border: 0; border-radius: 6px; }
    .aviso { background: #fff3cd; padding: 6px 8px; border-radius: 4px; font-size: .85rem; }
    #estado { margin: 6px 0; font-size: .9rem; }
    #mensaje { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
    #mensaje.ok { background: #d4edda; display: block; }
    #mensaje.error { background: #f8d7da; display: block; }
  </style>
</head>
<body>
  <h1>Reportar una obstrucción</h1>
  <p><a href="index.html">Ver el tablero</a></p>

  <label>1. Ubicación</label>
  <button id="btn-ubicacion" type="button">Usar mi ubicación</button>
  <div id="mapa-captura"></div>
  <div id="estado">Toca el mapa o usa tu ubicación.</div>

  <label for="cuadra">2. Cuadra</label>
  <select id="cuadra"><option value="">Elige la cuadra</option></select>

  <label for="categoria">3. Categoría</label>
  <select id="categoria">
    <option value="">Elige la categoría</option>
    <option value="doble_fila">Estacionamiento prohibido o doble fila</option>
    <option value="bloqueo_rampa_cebra_paradero">Bloqueo de rampa, cebra o paradero</option>
    <option value="invasion_anden">Invasión de andén</option>
  </select>

  <label for="actor">4. Tipo de actor</label>
  <select id="actor">
    <option value="">Elige el actor</option>
    <option value="vehiculo_particular">Vehículo particular</option>
    <option value="motocicleta">Motocicleta</option>
    <option value="vehiculo_carga">Vehículo de carga descargando</option>
    <option value="mobiliario_comercial">Mobiliario comercial</option>
  </select>

  <label for="foto">5. Foto (opcional)</label>
  <p class="aviso">Encuadra la obstrucción, no a las personas. No se deben ver placas ni rostros.</p>
  <input type="file" id="foto" accept="image/*" capture="environment">

  <button id="btn-enviar" type="button">Enviar reporte</button>
  <div id="mensaje"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="criticidad.js"></script>
  <script src="captura.js"></script>
</body>
</html>
