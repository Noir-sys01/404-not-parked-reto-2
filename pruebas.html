<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pruebas de criticidad</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .ok { color: green; } .mal { color: red; }
  </style>
</head>
<body>
  <h1>Pruebas de criticidad.js</h1>
  <div id="resultado">Cargando…</div>

  <script src="criticidad.js"></script>
  <script>
    // Casos calculados a mano (RF-02). Cambia "esperado" si cambias los pesos.
    const casos = [
      { nombre: "MP-014: invasión de andén, arterial, 11:40 (pico)  2+3+3",
        reporte: { categoria: "invasion_anden", cuadra: "CR5-C14-C15", fecha_hora: "2026-11-18T11:40" },
        esperado: { puntaje: 8, nivel: "Alto" } },
      { nombre: "Doble fila, secundaria, 15:00 (valle)  3+1+1",
        reporte: { categoria: "doble_fila", cuadra: "CR3-C14-C15", fecha_hora: "2026-11-18T15:00" },
        esperado: { puntaje: 5, nivel: "Medio" } }
    ];

    async function correr() {
      const criterios = await (await fetch("datos/criterios.json")).json();
      const vias = await (await fetch("datos/vias.json")).json();
      let html = "";
      for (const c of casos) {
        const r = calcularCriticidad(c.reporte, vias, criterios);
        const bien = r.puntaje === c.esperado.puntaje && r.nivel === c.esperado.nivel;
        html += `<p class="${bien ? "ok" : "mal"}">${bien ? "✔" : "✘"} ${c.nombre}<br>
                 Sistema: ${r.puntaje} → ${r.nivel} | A mano: ${c.esperado.puntaje} → ${c.esperado.nivel}</p>`;
      }
      document.getElementById("resultado").innerHTML = html;
    }
    correr().catch(e => document.getElementById("resultado").textContent = "Error: " + e.message);
  </script>
</body>
</html>
